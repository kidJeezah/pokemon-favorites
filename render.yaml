# Render Blueprint — dashboard: New → Blueprint → select this repo.
# Creates the API web service and the free Postgres with DATABASE_URL wired.
# ⚠️ Free Postgres expires after 30 days (Neon fallback documented in README).

databases:
  - name: pokemon-favorites-db
    plan: free
    databaseName: pokemon_favorites
    user: pokemon

services:
  - type: web
    name: pokemon-favorites-api
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip the TS build tooling
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # NODE_ENV=production makes npm omit devDependencies; the TS build needs them
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: pokemon-favorites-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://pokemon-favorites.vercel.app # update if the Vercel URL differs
      - key: POKEAPI_BASE_URL
        value: https://pokeapi.co/api/v2
